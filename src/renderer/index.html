<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post-Human</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="components/dropdown/dropdown.css">
    <link rel="stylesheet" href="components/slider/slider.css">
    <link rel="stylesheet" href="components/text-input/text-input.css">
    <link rel="stylesheet" href="components/date-input/date-input.css">
    <link rel="stylesheet" href="components/checkbox/checkbox.css">
    <link rel="stylesheet" href="components/drop-zone/drop-zone.css">
    <link rel="stylesheet" href="components/photo-strip/photo-strip.css">
    <link rel="stylesheet" href="components/segmented-control/segmented-control.css">
    <link rel="stylesheet" href="features/sidebar/sidebar.css">
    <link rel="stylesheet" href="features/progress-photos/progress-photos.css">
    <link rel="stylesheet" href="features/photo-editor/photo-editor.css">
    <link rel="stylesheet" href="features/photo-upload/photo-upload.css">
    <link rel="stylesheet" href="components/line-chart/line-chart.css">
    <link rel="stylesheet" href="features/biometrics/biometrics.css">
    <link rel="stylesheet" href="features/integrations/integrations.css">
</head>
<body>
    <div id="main-content">
        <div id="progress-photo-dashboard" style="display: none;">
            <h1>Progress Photos</h1>
            <div class="filter-container">
                <div class="filter-item interactable-dropdown-container">
                    <label class="interactable-label">Pose:</label>
                    <button id="pose-select-btn" class="filter-button interactable-button interactable-selector-btn">Select Pose</button>
                    <div id="pose-select-dropdown" class="interactable-dropdown-menu" style="display:none;">
                        <!-- Poses will be injected here -->
                    </div>
                </div>
                <div class="filter-item">
                    <label for="size-slider" class="interactable-label">Photo Size:</label>
                    <div>
                        <input type="range" id="size-slider" min="100" max="500" step="25">
                        <span id="size-value"></span>
                    </div>
                </div>
                <div class="filter-item">
                    <label for="crop-slider" class="interactable-label">Cropping Percent:</label>
                    <div>
                        <input type="range" id="crop-slider" min="10" max="500" step="10">
                        <span id="crop-value"></span>
                    </div>
                </div>
                <div class="filter-item">
                    <label for="aspect-slider" class="interactable-label">Aspect Ratio:</label>
                    <div>
                        <input type="range" id="aspect-slider" min="0.1" max="2" step="0.1">
                        <span id="aspect-value"></span>
                    </div>
                </div>
                <div class="filter-item">
                    <label for="vertical-offset-slider" class="interactable-label">Vertical Offset:</label>
                    <div>
                        <input type="range" id="vertical-offset-slider" min="-100" max="100" step="5">
                        <span id="vertical-offset-value"></span>
                    </div>
                </div>
                <div class="filter-item">
                    <label for="horizontal-offset-slider" class="interactable-label">Horizontal Offset:</label>
                    <div>
                        <input type="range" id="horizontal-offset-slider" min="-100" max="100" step="5">
                        <span id="horizontal-offset-value"></span>
                    </div>
                </div>
                <div class="filter-item">
                    <label class="interactable-label">Direction:</label>
                    <button id="view-toggle" class="filter-button interactable-button">Horizontal</button>
                </div>
                <div class="filter-item interactable-dropdown-container">
                    <label class="interactable-label">Visible Angles:</label>
                    <button id="column-toggle-btn" class="filter-button interactable-button interactable-selector-btn">Angles</button>
                    <div id="column-picker-dropdown" class="interactable-dropdown-menu" style="display:none;">
                        <!-- Checkboxes will be injected here -->
                    </div>
                </div>
            </div>
            <div id="photo-grid-header" class="photo-grid-header"></div>
            <div id="photo-grid-root" class="photo-grid-container"></div>
        </div>

        <div id="photo-editor-dashboard" style="display: none;">
            <h1>Photo Editor</h1>
            <div class="filter-container">
                <div class="filter-item interactable-dropdown-container">
                    <label class="interactable-label">Pose:</label>
                    <button id="editor-pose-select-btn" class="filter-button interactable-button interactable-selector-btn">Select Pose</button>
                    <div id="editor-pose-select-dropdown" class="interactable-dropdown-menu" style="display:none;"></div>
                </div>
                <div class="filter-item interactable-dropdown-container">
                    <label class="interactable-label">Date:</label>
                    <button id="editor-date-select-btn" class="filter-button interactable-button interactable-selector-btn">Select Date</button>
                    <div id="editor-date-select-dropdown" class="interactable-dropdown-menu" style="display:none;"></div>
                </div>
            </div>
            <div id="editor-thumbnail-strip" class="photo-strip"></div>
            <div class="editor-workspace">
            <div id="editor-canvas" class="editor-canvas" style="display: none;">
                <div class="editor-stage">
                    <img id="editor-image" class="editor-image" src="" alt="" draggable="false">
                    <div class="editor-landmark-line horizontal" data-landmark="yLandmark1"></div>
                    <div class="editor-landmark-line horizontal" data-landmark="yLandmark2"></div>
                    <div class="editor-landmark-line vertical" data-landmark="xLandmark"></div>
                    <div id="editor-crop-rect" class="editor-crop-rect"></div>
                    <div class="editor-landmark" data-landmark="yLandmark1" title="Y Landmark 1"></div>
                    <div class="editor-landmark" data-landmark="yLandmark2" title="Y Landmark 2"></div>
                    <div class="editor-landmark" data-landmark="xLandmark" title="X Landmark"></div>
                </div>
            </div>
            <div id="editor-sidebar" class="editor-sidebar" style="display: none;">
                <div class="editor-sidebar-item">
                    <label for="editor-y-landmark-1-label" class="interactable-label">Y Landmark 1:</label>
                    <input type="text" id="editor-y-landmark-1-label" class="text-input" data-pose-field="yLandmark1Label">
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-y-landmark-2-label" class="interactable-label">Y Landmark 2:</label>
                    <input type="text" id="editor-y-landmark-2-label" class="text-input" data-pose-field="yLandmark2Label">
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-x-landmark-label" class="interactable-label">X Landmark:</label>
                    <input type="text" id="editor-x-landmark-label" class="text-input" data-pose-field="xLandmarkLabel">
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-cropping-percent" class="interactable-label">Cropping Percent:</label>
                    <div>
                        <input type="range" id="editor-cropping-percent" data-pose-number="croppingPercent" min="10" max="500" step="10">
                        <span id="editor-cropping-percent-value"></span>
                    </div>
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-aspect-ratio" class="interactable-label">Aspect Ratio:</label>
                    <div>
                        <input type="range" id="editor-aspect-ratio" data-pose-number="aspectRatio" min="0.1" max="2" step="0.1">
                        <span id="editor-aspect-ratio-value"></span>
                    </div>
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-vertical-offset" class="interactable-label">Vertical Offset:</label>
                    <div>
                        <input type="range" id="editor-vertical-offset" data-pose-number="verticalOffset" min="-100" max="100" step="5">
                        <span id="editor-vertical-offset-value"></span>
                    </div>
                </div>
                <div class="editor-sidebar-item">
                    <label for="editor-horizontal-offset" class="interactable-label">Horizontal Offset:</label>
                    <div>
                        <input type="range" id="editor-horizontal-offset" data-pose-number="horizontalOffset" min="-100" max="100" step="5">
                        <span id="editor-horizontal-offset-value"></span>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <div id="photo-upload-dashboard" style="display: none;">
            <h1>Photo Upload</h1>
            <div class="filter-container">
                <div class="filter-item">
                    <label for="upload-date" class="interactable-label">Date:</label>
                    <input type="date" id="upload-date">
                </div>
                <div class="filter-item interactable-dropdown-container">
                    <label class="interactable-label">Pose:</label>
                    <button id="upload-pose-select-btn" class="filter-button interactable-button interactable-selector-btn">Select Pose</button>
                    <div id="upload-pose-select-dropdown" class="interactable-dropdown-menu" style="display:none;"></div>
                </div>
            </div>
            <div id="upload-drop-container" class="upload-drop-container"></div>
            <div id="upload-thumbnail-strip" class="photo-strip"></div>
            <div class="upload-actions" style="display: none;">
                <button id="upload-save" class="interactable-button" disabled>Save</button>
                <span id="upload-status" class="upload-status"></span>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="tpl-biometrics-dashboard">
        <div class="temp-dashboard biometrics-dashboard">
            <h1>Biometrics</h1>
            <h2>Weight</h2>
            <div class="biometrics-header">
                <div class="biometrics-periods"></div>
                <div class="interactable-dropdown-container">
                    <button type="button" class="interactable-button interactable-selector-btn biometrics-effort-btn">Effort</button>
                    <div class="interactable-dropdown-menu biometrics-effort-menu" style="display:none;"></div>
                </div>
                <button type="button" class="interactable-button biometrics-secondary-btn biometrics-new-effort-btn">New Effort</button>
                <button type="button" class="interactable-button biometrics-secondary-btn biometrics-withings-btn">Withings</button>
            </div>
            <form class="biometrics-effort-editor" hidden>
                <div class="biometrics-field">
                    <span class="interactable-label">Type</span>
                    <div class="interactable-dropdown-container">
                        <button type="button" class="interactable-button interactable-selector-btn biometrics-effort-type-btn">Type</button>
                        <div class="interactable-dropdown-menu biometrics-effort-type-menu" style="display:none;"></div>
                    </div>
                </div>
                <label class="biometrics-field">
                    <span class="interactable-label">Start Date</span>
                    <input type="date" class="biometrics-effort-start" required>
                </label>
                <label class="biometrics-field biometrics-effort-description-field">
                    <span class="interactable-label">Description</span>
                    <input type="text" class="text-input biometrics-effort-description" placeholder="e.g. Winter cut">
                </label>
                <button type="submit" class="interactable-button biometrics-effort-create">Create</button>
                <button type="button" class="interactable-button biometrics-secondary-btn biometrics-effort-cancel">Cancel</button>
            </form>
            <div class="biometrics-chart"></div>
        </div>
    </template>
    <template id="tpl-integrations-dashboard">
        <div class="temp-dashboard integrations-dashboard">
            <h1>Integrations</h1>
            <section class="integrations-card">
                <h2>Withings</h2>
                <div class="integrations-field">
                    <label for="withings-client_id" class="interactable-label">Client ID</label>
                    <input type="text" id="withings-client_id" class="text-input" autocomplete="off" disabled>
                </div>
                <div class="integrations-field">
                    <label for="withings-client_secret" class="interactable-label">Client Secret</label>
                    <input type="text" id="withings-client_secret" class="text-input" autocomplete="off" disabled>
                </div>
                <div class="integrations-field">
                    <label for="withings-api_endpoint" class="interactable-label">API Endpoint</label>
                    <input type="text" id="withings-api_endpoint" class="text-input" autocomplete="off" disabled>
                </div>
                <p id="integrations-status" class="integrations-status" aria-live="polite">Loading…</p>
            </section>
        </div>
    </template>
    <template id="tpl-header-item">
        <div class="header-item grid-header-cell"></div>
    </template>

    <template id="tpl-photo-row">
        <div class="photo-row">
            <div class="photo-date-column grid-header-cell"></div>
            <div class="photo-items"></div>
        </div>
    </template>

    <template id="tpl-photo-item">
        <div class="photo-item">
            <div class="photo-container">
                <img src="" alt="" class="progress-photo" 
                     onload="applyDynamicCrop(this)"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="photo-placeholder"></div>
            </div>
        </div>
    </template>

    <template id="tpl-blank-item">
        <div class="photo-item">
            <div class="photo-container blank-placeholder">
            </div>
        </div>
    </template>

    <template id="tpl-photo-strip-item">
        <div class="photo-strip-item">
            <div class="photo-container">
                <img src="" alt="" class="progress-photo"
                     onload="applyDynamicCrop(this)"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="photo-placeholder"></div>
            </div>
            <div class="photo-strip-label"></div>
        </div>
    </template>

    <script type="module" src="../../dist/src/renderer/features/sidebar/sidebar.js"></script>
</body>
</html>
